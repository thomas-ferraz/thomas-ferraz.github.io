name: Generate Tag Pages

on:
  push:
    branches:
      - main
      - master
      - gh-pages
    paths:
      - '_publications/**'
      - 'publications/tag_template.html'
      - 'generate_tag_pages.rb'
      - '.github/workflows/generate-tag-pages.yml'
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write

jobs:
  generate-tags:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Generate tag pages
        run: |
          ruby generate_tag_pages.rb

      - name: Check for changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain publications/*.html 2>/dev/null)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add publications/*.html
          git commit -m "Auto-generate tag pages [skip ci]" || exit 0
          git push

