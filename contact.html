---
title: Contact
layout: page
---

<section class="contact-form-section">
    <h1>Contact</h1>
    <p>Feel free to reach out! I'll get back to you as soon as possible.</p>
    
    <form 
        id="contact-form"
        class="contact-form"
        action="https://script.google.com/macros/s/AKfycbzd7OFt1flGLwLYyDRMepSANmGzpDXDXIqdCagM7aCKOp4SMfrJzWHAA5D0_bCVB7e2/exec"
        method="POST"
        target="hidden_iframe"
        onsubmit="return handleFormSubmit(event)"
    >
        <div class="form-group">
            <label for="name">
                Your name
                <span class="required">*</span>
            </label>
            <input 
                id="name" 
                name="name" 
                type="text" 
                placeholder="Enter your name"
                required 
                autocomplete="name"
            />
            <span class="form-error" id="name-error"></span>
        </div>

        <div class="form-group">
            <label for="email">
                Your email
                <span class="required">*</span>
            </label>
            <input 
                id="email" 
                name="email" 
                type="email" 
                placeholder="your.email@example.com"
                required 
                autocomplete="email"
            />
            <span class="form-error" id="email-error"></span>
        </div>

        <div class="form-group">
            <label for="subject">
                Subject
            </label>
            <input 
                id="subject" 
                name="subject" 
                type="text" 
                placeholder="What is this about?"
                autocomplete="off"
            />
            <span class="form-error" id="subject-error"></span>
        </div>

        <div class="form-group">
            <label for="message">
                Your message
            </label>
            <textarea 
                id="message" 
                name="message" 
                rows="6" 
                placeholder="Type your message here..."
            ></textarea>
            <span class="form-error" id="message-error"></span>
        </div>

        <button type="submit" class="form-submit-button" id="submit-button">
            Send Message
        </button>
    </form>

    <div id="form-success" class="form-success">
        <p><strong>Thank you!</strong> Your message has been sent successfully. I'll get back to you soon.</p>
    </div>

    <div id="form-error" class="form-error-message" style="display: none;">
        <p><strong>Error:</strong> <span id="error-text">Failed to send your message. Please try again or contact me directly.</span></p>
    </div>

    <!-- Hidden iframe for form submission (avoids CORS issues) -->
    <iframe name="hidden_iframe" id="hidden_iframe" style="display: none;"></iframe>

</section>

<script>
function handleFormSubmit(e) {
    const form = document.getElementById('contact-form');
    const submitButton = document.getElementById('submit-button');
    const successMessage = document.getElementById('form-success');
    const errorMessage = document.getElementById('form-error');
    const errorText = document.getElementById('error-text');
    const hiddenIframe = document.getElementById('hidden_iframe');
    
    // Validate form
    if (!form.checkValidity()) {
        e.preventDefault();
        form.reportValidity();
        return false;
    }
    
    // Hide previous messages
    successMessage.classList.remove('show');
    errorMessage.style.display = 'none';
    
    // Disable submit button
    submitButton.disabled = true;
    submitButton.textContent = 'Sending...';
    
    // Clear previous errors
    const errorElements = form.querySelectorAll('.form-error');
    errorElements.forEach(el => el.classList.remove('show'));
    
    // Listen for success message from iframe (via postMessage)
    let submissionHandled = false;
    
    const messageHandler = function(event) {
        // Accept messages from Google Apps Script domain
        if (event.origin !== 'https://script.google.com' && event.origin !== 'https://script.googleusercontent.com') {
            return;
        }
        
        if (submissionHandled) return;
        submissionHandled = true;
        
        submitButton.disabled = false;
        submitButton.textContent = 'Send Message';
        
        if (event.data && event.data.result === 'success') {
            form.style.display = 'none';
            successMessage.classList.add('show');
            form.reset();
        } else if (event.data && event.data.result === 'error') {
            errorText.textContent = event.data.message || 'Failed to send your message. Please try again.';
            errorMessage.style.display = 'block';
        }
        
        window.removeEventListener('message', messageHandler);
    };
    
    window.addEventListener('message', messageHandler);
    
    // Fallback: if iframe loads but no message received, assume success after delay
    hiddenIframe.onload = function() {
        setTimeout(function() {
            if (!submissionHandled) {
                submissionHandled = true;
                submitButton.disabled = false;
                submitButton.textContent = 'Send Message';
                form.style.display = 'none';
                successMessage.classList.add('show');
                form.reset();
                window.removeEventListener('message', messageHandler);
            }
        }, 1000);
    };
    
    // Allow form to submit normally to the iframe
    // This avoids CORS issues completely
    return true;
}

// Optional: Add real-time validation feedback
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('contact-form');
    const inputs = form.querySelectorAll('input[required], textarea[required]');
    
    inputs.forEach(input => {
        input.addEventListener('blur', function() {
            if (!this.validity.valid) {
                const errorId = this.id + '-error';
                const errorEl = document.getElementById(errorId);
                if (errorEl) {
                    if (this.validity.valueMissing) {
                        errorEl.textContent = 'This field is required.';
                    } else if (this.validity.typeMismatch && this.type === 'email') {
                        errorEl.textContent = 'Please enter a valid email address.';
                    }
                    errorEl.classList.add('show');
                }
            } else {
                const errorId = this.id + '-error';
                const errorEl = document.getElementById(errorId);
                if (errorEl) {
                    errorEl.classList.remove('show');
                }
            }
        });
        
        input.addEventListener('input', function() {
            if (this.validity.valid) {
                const errorId = this.id + '-error';
                const errorEl = document.getElementById(errorId);
                if (errorEl) {
                    errorEl.classList.remove('show');
                }
            }
        });
    });
});
</script>
