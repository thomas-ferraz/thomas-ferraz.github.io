bio:
  short: >-
    Hi, I'm **Thomas Ferraz**, I'm Research Scientist at [**NAVER LABS Europe**](https://europe.naverlabs.com/), on the **LLM Agents Team**, and also **PhD Candidate at LIG -** [**APTIKAL**](https://devijvee.gricad-pages.univ-grenoble-alpes.fr/aptikal/index.html) & [**GETALP**](https://lig-getalp.imag.fr/) **(Université Grenoble-Alpes)**, advised by [**Vassilina Nikoulina**](https://europe.naverlabs.com/people_user_naverlabs/Vassilina-Nikoulina/), [**Maxime Peyrard**](https://peyrardm.github.io/), and [**Eric Gaussier**](https://ama.liglab.fr/~gaussier/), exploring how large language models can reason and plan more effectively by combining efficient neural computation with interpretable latent structures.
    <br>
    My main research contributions rely on **Efficient Learning for Language Models**. Before working on LLM agents and reasoning, I contributed to **Multilingual NLP** and **Low-Resource NLP**, including works on multilingual speech recognition, distillation, and cross-lingual modeling.  
    <br>
    I previously completed a Master’s in **Applied Math & AI (MVA)** at **ENS Paris-Saclay** and **Institut Polytechnique de Paris**, and an engineering degree from the **University of São Paulo**, where I graduated top of my class. I have also gained experience through research internships at **Meta**, **Amazon**, **Apple**, and **NAVER LABS Europe**.
