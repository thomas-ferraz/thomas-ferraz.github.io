bio:
  short: >-
    Hi, I'm **Thomas Ferraz**, I'm Research Scientist at **NAVER LABS Europe**, on the **LLM Agents Team**, and also **PhD Candidate at Université Grenoble-Alpes**, advised by [Vassilina Nikoulina](https://scholar.google.com/citations?user=IVJ4wN4AAAAJ&hl=fr), [Maxime Peyrard](https://peyrardm.github.io/), and [Eric Gaussier](https://ama.liglab.fr/~gaussier/), exploring how large language models can reason and plan more effectively by combining efficient neural computation with interpretable latent structures.
    
    My main research contributions rely on **Efficient Learning for Language Models**. Before working on LLM agents and reasoning, I contributed to **Multilingual NLP** and **Low-Resource NLP**, including works on multilingual speech recognition, distillation, and cross-lingual modeling.  

    I previously completed a Master’s in **Applied Math & AI (MVA)** at **ENS Paris-Saclay** and **Institut Polytechnique de Paris**, and an engineering degree from the **University of São Paulo**, where I graduated top of my class.

    I have also gained experience through research internships at **Meta**, **Amazon**, **Apple**, and **NAVER LABS Europe**.
selected_publications_intro: >-
  A selection of papers that reflect my main research focus and contributions.
selected_publications:
  - title: "LLM Self-Correction with DeCRIM: Decompose, Critique, and Refine for Enhanced Following of Instructions with Multiple Constraints"
    image: assets/images/selected_publications/DeCRIM.png
    authors: Thomas Palmeira Ferraz, Kartik Mehta, Yu-Hsiang Lin, Haw-Shiuan Chang, Shereen Oraby, Sijia Liu, Vivek Subramanian, Tagyoung Chung, Mohit Bansal, Nanyun Peng
    venue: "EMNLP, 2024 & Sys2Reasoning @ NeurIPS, 2024"
    arxiv: https://arxiv.org/abs/2410.06458
    pdf: https://arxiv.org/pdf/2410.06458
    bib: https://arxiv.org/bibtex/2410.06458
    summary: >-
      Introducing RealInstruct to evaluate LLMs on real multi-constrained instructions, and DeCRIM self-correction that improves
      instruction following by decomposing requests and refining responses, enabling open LLMs to outperform GPT-4 with strong feedback.
  - title: "Multilingual DistilWhisper: Efficient Distillation of Multi-task Speech Models via Language-Specific Experts"
    image: assets/images/selected_publications/DistilWhisper.png
    authors: Thomas Palmeira Ferraz, Marcely Zanon Boito, Caroline Brun, Vassilina Nikoulina
    venue: ICASSP, 2024
    arxiv: https://arxiv.org/abs/2311.01070
    pdf: https://arxiv.org/pdf/2311.01070
    bib: https://arxiv.org/bibtex/2311.01070
    summary: >-
      Proposes a lightweight adaptation method bridging the gap between small and large speech models on under-represented languages
      by leveraging language-specific experts and knowledge distillation, outperforming fine-tuning and LoRA with minimal overhead.
  - title: "ZeroBERTo: Leveraging Zero-Shot Text Classification by Topic Modeling"
    image: assets/images/selected_publications/ZeroBERTo.png
    authors: Alexandre Alcoforado, Thomas Palmeira Ferraz, Rodrigo Gerber, Enzo Bustos, André Seidel Oliveira, Bruno Miguel Veloso, Fabio Levy Siqueira, Anna Helena Reali Costa
    venue: PROPOR, 2022
    arxiv: https://arxiv.org/abs/2201.01337
    pdf: https://arxiv.org/pdf/2201.01337
    bib: https://arxiv.org/bibtex/2201.01337
    summary: >-
      ZeroBERTo combines topic modeling with language models for zero-shot text classification, overcoming input size limitations and reducing runtime,
      achieving a 12% better F1 score and 13x faster inference compared to XLM-R on a Portuguese benchmark.
